name: Build Hana Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hana-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: Sukumar002/zmk/.github/workflows/build-user-config.yml@7e05bf9846900e6eafd7b4665ac5240dcaca7b39
    with:
      build_matrix_path: build-hana.yaml
      archive_name: hana-firmware
